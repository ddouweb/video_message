[package]
name = "videoMsg"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = {version ="4.0.0"}
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.6.2", features = ["mysql", "runtime-tokio-rustls", "chrono","offline"] }
reqwest = { version = "0.11.24", default-features = false, features = ["json", "rustls-tls"] }
dotenv = "0.15.0"
chrono = "0.4"
img_hash = "3.2"
image = "0.24"
uuid = { version = "1.0", features = ["v4"] }
tract-onnx = "0.21"

[profile.release]
lto = true
opt-level = "z"
panic = "abort"

[[bin]]
name = "videoMsg"
path = "src/main.rs"