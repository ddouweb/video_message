services:
  nginx:
    image: nginx:1.20.2-alpine
    container_name: nginx
    volumes:
      - /data/video_root/nginx.conf:/etc/nginx/conf.d/default.conf  # 挂载 Nginx 配置文件
    ports:
      - "443:443"
      - "80:80"

  mariadb:
    image: mariadb:10.6.14
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      TZ: Asia/Shanghai
    command: --lower-case-table-names=1
    volumes:
      - /data/video_root/mariadb-init.sql:/docker-entrypoint-initdb.d/init.sql  # 挂载初始化 SQL 文件
      - /data/video_root/docker-data/mariadb:/var/lib/mysql

  video_message:
    image: webtao/scratch:zoneinfo
    container_name: video_message
    environment:
      TZ: Asia/Shanghai #日志时间戳使用本地时区(镜像已含zoneinfo)
      DATABASE_URL: mysql://video:123456@mariadb:3306/video?timezone=Asia/Shanghai
      APP_API_TOKEN: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx  #PUSH_PLUS密钥
      APP_API_TOPIC: video                            #PUSH_PLUS群组编码
      APP_IMG_SERVER: https://img.xxxxxxxxxxxxxxx.cn/img #收到消息后，消息内图片的url地址前缀
      APP_API_TIMEOUT: 600
      APP_MIN_PIC_COUNT: 5                           #单条推送最少图片数
      APP_MESSAGE_SIZE: 25                           #单条推送最多图片数
      APP_POLLER: on                                #萤石轮询抓拍模式开关(on/off)
      EZVIZ_APP_KEY: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx #萤石开放平台appKey
      EZVIZ_APP_SECRET: xxxxxxxxxxxxxxxxxxxxxxxxxxx #萤石开放平台appSecret
      APP_CAPTURE_INTERVAL_SECS: 120                #白天无人时抓拍间隔(秒)
      APP_ACTIVE_CAPTURE_INTERVAL_SECS: 60          #有人期间(最近保留过有人图)抓拍间隔(秒)
      APP_NIGHT_CAPTURE_INTERVAL_SECS: 900          #夜间无人时抓拍间隔(秒)
      APP_VISIT_END_SECS: 600                       #无新保留图超过该秒数判定"到访结束",触发图集收尾
      APP_VISIT_REMIND_SECS: 1800                   #到访期间长时间有人,每隔该秒数补一条即时提醒
      APP_TOKEN_REFRESH_HOURS: 120                  #accessToken刷新周期(小时),默认120即5天
      APP_SIMILARITY_THRESHOLD: "0.95"              #与上一张图相似度阈值,高于则丢弃(低于的都保留)
      APP_PERSON_ALERT_ENABLED: "true"              #本地人员检测开关,开启后轮询抓拍只保留有人的图
      APP_MODEL_PATH: models/yolov8n-pose.onnx      #人员检测模型(pose版,带17关键点可判躺卧)
      APP_PERSON_CONFIDENCE_THRESHOLD: "0.5"        #人员检测置信度阈值
      APP_LYING_ALERT_ENABLED: "on"                 #躺卧姿态即时提醒开关(on/off)
      APP_LYING_ALERT_COOLDOWN_SECS: 1800           #同设备躺卧提醒冷却期(秒)
      APP_INACTIVITY_ALERT_ENABLED: "on"            #日间长时间无人提醒开关(on/off)
      APP_INACTIVITY_ALERT_SECS: 7200               #日间连续无人多久推送提醒(秒)
    volumes:
      - /data/video_root/apps/app:/app:ro #应用可执行文件
      - /data/video_root/models:/models:ro #模型文件
      - /data/video_root/his_path:/data/his_path:rw  #存放历史截图
      - /data/video_root/last_path:/data/last_path:rw #存放最新的截图